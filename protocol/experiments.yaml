study: cpu-gpu-npu-inference
scope: inference
author: Marlon Zanardi
recorded_on: 2026-09-26
recorded_runs:
  - results/windows-workstation/20260926T195237Z
  - results/apple-m4-pro/20260926T204025Z
  - results/apple-m1/20260926T203102Z

models:
  - id: mobilenet_v2
    input_shape: [1, 3, 224, 224]
    role: small_edge_workload
  - id: resnet50
    input_shape: [1, 3, 224, 224]
    role: higher_compute_workload

primary_batch: 1
batch_sweep: [1, 8, 32]
warmup_iterations: 20
measured_iterations: 100
sessions: 3
statistics: [median, p95]

precisions:
  iso: fp32
  vendor_optimal: recorded_as_a_separate_column

ranking_rule: compare_only_inside_one_machine_manifest

experiments:
  windows_workstation:
    id: A
    runtime: onnxruntime
    devices: [cpu, cuda]
    npu: unavailable
    excluded_devices: [amd_radeon_igpu]
    energy: nvidia_smi_board_power_integrated_over_the_run
  mac_apple_silicon:
    id: B
    runtime: coreml
    compute_units: [cpuOnly, cpuAndGPU, cpuAndNeuralEngine]
    excluded_compute_units: [all]
    energy: powermetrics_cpu_power_gpu_power_ane_power
    npu_run_is_valid_when:
      - compute_plan_weight_share_at_least_half_on_the_neural_engine
      - ane_power_rises_above_the_idle_baseline_during_the_measured_window
      - ane_power_stays_at_baseline_during_cpuOnly_and_cpuAndGPU
    cited_run:
      placement_rule_applied: compute_plan_weight_share_at_least_half
      ane_power: sampled
      ane_power_above_other_runs: true_for_float16_neural_engine
      model_source: onnx_fp32_loaded_with_onnx2torch
      onnx_file_sha256_matches_windows: false
      mobilenet_v2_weights: IMAGENET1K_V2
      resnet50_weights: IMAGENET1K_V2
      inter_session_pause_seconds: 60
      power_source: ac

output:
  directory: results/{machine_id}/{utc_timestamp}
  files:
    - manifest.json
    - samples.jsonl
    - summary.csv
    - figures/
